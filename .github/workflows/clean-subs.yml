name: Clean subscription list

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, do not change anything"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: clean-subs
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links and clean README
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/clean_readme.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove dead subscription links"
            git push
          fi
