name: Clean subscription list

on:
  push:
    branches: [main]
    paths: ["README.md"]   # you edited the README by hand -> only the numbers get fixed (no network checks)
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, do not change anything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clean-subs
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links and clean README
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          COUNTS_ONLY: ${{ github.event_name == 'push' && '1' || '0' }}
          STRIKES: "1"
        run: python scripts/clean_readme.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: clean dead subscription links / refresh counts"
            git pull --rebase
            git push
          fi
